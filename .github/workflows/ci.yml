name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
        env:
          SIGNALOPS_DATABASE_URL: sqlite+aiosqlite:///./ci-migration.db
      - run: pytest -q

