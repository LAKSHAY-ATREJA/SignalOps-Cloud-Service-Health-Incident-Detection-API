services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SIGNALOPS_DATABASE_URL: postgresql+asyncpg://signalops:signalops@db:5432/signalops
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalops
      POSTGRES_USER: signalops
      POSTGRES_PASSWORD: signalops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signalops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - signalops_data:/var/lib/postgresql/data

volumes:
  signalops_data:
